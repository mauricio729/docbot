services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CHROMA_PATH: /data/chroma_db
      DB_PATH: /data/docbot.db
    volumes:
      - dados:/data
      - ./docs:/app/docs
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
volumes:
  dados:
